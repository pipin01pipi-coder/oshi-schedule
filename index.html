<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小柳ロウ 配信スケジュール</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- ヘッダー -->
        <header class="app-header">
            <h1 class="header-title">小柳ロウ <span class="sub">配信スケジュール</span></h1>
            <div class="view-tabs">
                <button class="tab-btn active" id="btn-week">週</button>
                <button class="tab-btn" id="btn-month">月</button>
            </div>
        </header>

        <!-- 日付切り替えナビ -->
        <section class="date-nav">
            <button class="nav-btn" id="prev-btn">&lt;</button>
            <div class="date-text" id="date-range-text">2026年 10/12 - 10/18</div>
            <button class="today-btn" id="today-btn">今日</button>
            <button class="nav-btn" id="next-btn">&gt;</button>
        </section>

        <!-- スタッツバー -->
        <section class="stats-bar">
            <div class="stat-pill"><span id="stat-count">0</span><small>回</small></div>
            <div class="stat-pill"><span id="stat-hours">0</span><small>時間</small></div>
            <div class="stat-pill"><span>0</span><small>件</small></div>
            <div class="game-tags" id="game-tags-container"></div>
        </section>

        <!-- 手帳紙面エリア -->
        <main class="paper-sheet">
            <div class="clip-decor"></div>

            <!-- 週表示 (バーティカル) -->
            <div id="view-week" class="calendar-view">
                <div class="week-header-row" id="week-header-row"></div>
                <div class="week-body">
                    <div class="time-axis" id="time-axis"></div>
                    <div class="week-grid" id="week-grid"></div>
                </div>
            </div>

            <!-- 月表示 (カレンダー) -->
            <div id="view-month" class="calendar-view hidden">
                <div class="month-header-row">
                    <div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div><div>日</div>
                </div>
                <div class="month-grid" id="month-grid"></div>
            </div>
        </main>
    </div>

    <!-- 配信詳細モーダル (初期状態は hidden で非表示) -->
    <div class="modal-overlay hidden" id="modal-overlay">
        <div class="modal-card">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-badges" id="modal-badges"></div>
            <img class="modal-thumb" id="modal-thumb" src="" alt="サムネイル">
            <h2 class="modal-title" id="modal-title"></h2>
            
            <div class="modal-details">
                <div class="detail-row"><span>日付</span><strong id="modal-date"></strong></div>
                <div class="detail-row"><span>時間</span><strong id="modal-time"></strong></div>
                <div class="detail-row"><span>長さ</span><strong>約2.5時間</strong></div>
            </div>

            <a class="modal-btn" id="modal-link" href="#" target="_blank">YouTubeの枠を開く ↗</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
