<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>葛葉 配信スケジュール</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- PC時：左側サイドパネル / スマホ時：上部配置 -->
        <aside class="side-panel">
            <header class="app-header">
                <h1 class="header-title">小柳ロウ<br><span class="sub">配信スケジュール</span></h1>
                <div class="view-tabs mobile-only-tabs">
                    <button class="tab-btn active" id="btn-week-m">週</button>
                    <button class="tab-btn" id="btn-month-m">月</button>
                </div>
            </header>

            <!-- 日付ナビ（スマホ表示用） -->
            <div class="date-nav mobile-nav">
                <button class="nav-btn" id="prev-btn-m">&lt;</button>
                <div class="date-text" id="date-range-text-m">2026年 10/12 - 10/18</div>
                <button class="today-btn" id="today-btn-m">今日</button>
                <button class="nav-btn" id="next-btn-m">&gt;</button>
            </div>

            <!-- スタッツボックス -->
            <div class="stats-box">
                <div class="stat-pills-row">
                    <div class="stat-pill"><span id="stat-count">0</span><small>回</small></div>
                    <div class="stat-pill"><span id="stat-hours">0</span><small>時間</small></div>
                    <div class="stat-pill"><span>0</span><small>件</small></div>
                </div>
                <div class="game-tags-scroll" id="game-tags-container"></div>
            </div>

           <!-- 締め切りメモ帳カード（手動追加機能付き） -->
            <div class="memo-card">
                <div class="memo-header-row">
                    <div class="memo-title">締切が近いもの・メモ</div>
                    <button class="memo-add-btn" id="open-memo-modal">+ 追加</button>
                </div>
                <div class="memo-list" id="memo-list-container">
                    <!-- JSで動的に追加したメモがここに表示されます -->
                </div>
            </div> 
        </aside>

        <!-- PC時：右側メインエリア / スマホ時：メインカレンダー -->
        <main class="main-calendar-area">
            <!-- PC用ヘッダーナビ -->
            <div class="pc-top-bar">
                <div class="date-nav">
                    <button class="nav-btn" id="prev-btn">&lt;</button>
                    <div class="date-text" id="date-range-text">2026年 10/12 - 10/18</div>
                    <button class="today-btn" id="today-btn">今日</button>
                    <button class="nav-btn" id="next-btn">&gt;</button>
                </div>
                <div class="view-tabs pc-only-tabs">
                    <button class="tab-btn active" id="btn-week">週</button>
                    <button class="tab-btn" id="btn-month">月</button>
                </div>
            </div>

            <!-- 手帳用紙本体 -->
            <div class="paper-sheet">
                <div class="clip-decor"></div>

                <!-- 週表示 (バーティカル) -->
                <div id="view-week" class="calendar-view">
                    <div class="week-header-row" id="week-header-row"></div>
                    <div class="week-body">
                        <div class="time-axis" id="time-axis"></div>
                        <div class="week-grid" id="week-grid"></div>
                    </div>
                </div>

                <!-- 月表示 (カレンダー) -->
                <div id="view-month" class="calendar-view hidden">
                    <div class="month-header-row">
                        <div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div><div>日</div>
                    </div>
                    <div class="month-grid" id="month-grid"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- アーカイブカード詳細モーダル -->
    <div class="modal-overlay hidden" id="modal-overlay">
        <div class="modal-card">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-badges" id="modal-badges"></div>
            <img class="modal-thumb" id="modal-thumb" src="" alt="サムネイル">
            <h2 class="modal-title" id="modal-title"></h2>
            
            <div class="modal-details">
                <div class="detail-row"><span>日付</span><strong id="modal-date"></strong></div>
                <div class="detail-row"><span>時間</span><strong id="modal-time"></strong></div>
                <div class="detail-row"><span>長さ</span><strong>約2.5時間</strong></div>
            </div>

            <a class="modal-btn" id="modal-link" href="#" target="_blank">YouTubeの枠を開く ↗</a>
        </div>
    </div>
<!-- メモ追加モーダル -->
    <div class="modal-overlay hidden" id="memo-modal-overlay">
        <div class="modal-card">
            <button class="modal-close" id="memo-modal-close">&times;</button>
            <h2 class="modal-title">新しいメモ・締切を追加</h2>
            
            <div class="memo-form">
                <div class="form-group">
                    <label>タイトル（例: グッズ受注）</label>
                    <input type="text" id="memo-input-title" placeholder="イベントや締切の名称">
                </div>
                <div class="form-group">
                    <label>日時・期限（例: 10/25 (日) 23:59）</label>
                    <input type="text" id="memo-input-date" placeholder="11/6 (金) 23:59">
                </div>
                <div class="form-group">
                    <label>あと何日？（例: あと6日）</label>
                    <input type="text" id="memo-input-badge" placeholder="あと6日">
                </div>
                <button class="modal-btn" id="memo-save-btn">追加する</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
